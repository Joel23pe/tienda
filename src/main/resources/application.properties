spring.application.name=tienda

# ============================================================
# CAPÍTULO 1 - 1.1 CONFIGURACIÓN DE LA CONEXIÓN (H2 en memoria)
# ============================================================
spring.datasource.url=jdbc:h2:mem:tiendadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# update: Hibernate crea/actualiza las tablas a partir de las @Entity
spring.jpa.hibernate.ddl-auto=update
# Muestra el SQL generado en consola (útil como evidencia)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# CAPÍTULO 3 - PARÁMETROS DEL JWT
