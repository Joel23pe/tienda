# PostgreSQL (producción). Los valores vienen de variables de entorno;
# si no existen, usa la base local para poder probar en tu PC.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tienda}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# Render asigna el puerto en la variable PORT
server.port=${PORT:8080}

spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Clave JWT de producción: viene de variable de entorno
app.jwt.secret=${JWT_SECRET}